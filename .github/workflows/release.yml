name: Release

# Cut a release by pushing a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# The workflow builds the GUI installers (macOS / Windows / Linux) and the
# standalone CLI binaries, then publishes them all to a single GitHub Release.
# It can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release

jobs:
  # ---------------------------------------------------------------------------
  # GUI installers — one native runner per OS (electron-builder cannot reliably
  # cross-compile). Artifacts are uploaded and attached to the Release later.
  # ---------------------------------------------------------------------------
  build-gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build renderer + main
        run: npm run build:all

      - name: Package (unsigned)
        # publish=never: we attach artifacts ourselves in the release job.
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing identities are configured, so disable signing to
          # avoid the build hanging or failing. Users bypass Gatekeeper /
          # SmartScreen per the README.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package the smoke test's twin (allows --remote-debugging-port)
        # The shipped build refuses the switch (New-40); the driven checks
        # run on this twin from the same build, one packaged flag apart.
        run: npm run package:twin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test the packaged app (CSP, sandbox, unlock)
        # The installed app loads its renderer from inside app.asar, which
        # `npm run test:e2e` never does (GUI-ENV-BREAKDOWN New-19).
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
            # sandbox needs; an installed desktop allows them via AppArmor.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a npm run test:packaged
          else
            npm run test:packaged
          fi

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p staged
          # Only ship end-user artifacts, not electron-builder's metadata.
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} staged/ \;
          ls -la staged

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: staged/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # CLI standalone binaries — Bun cross-compiles every target from one runner.
  # ---------------------------------------------------------------------------
  build-cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - uses: oven-sh/setup-bun@v2

      - name: Build standalone binaries
        run: npm run package:cli

      - name: Check the Linux binary against the Node CLI
        # Env vaults derive keys with async PBKDF2, which the binaries run on
        # Bun's node:crypto: each must open the other's vaults (New-5).
        run: node scripts/verify-cli-binary.mjs dist-cli/vault-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist-cli/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a single GitHub Release with every artifact attached.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-gui, build-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Generate checksums
        # SHA-256 for every artifact (all platforms) so users can verify
        # integrity. This is the baseline; the GPG step below adds authenticity.
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: GPG-sign checksums
        # Authenticity for the checksum manifest. Skipped automatically when no
        # signing key is configured, so the release never fails on its absence.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: release
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not set — skipping GPG signature (checksums still attached)."
            exit 0
          fi
          # The secret is the armored private key, base64-encoded — see
          # docs/CODE_SIGNING.md. Base64 survives the newline-mangling that a
          # raw ASCII-armored paste suffers in GitHub secrets (the cause of the
          # "no valid OpenPGP data found" import failure). Decode, then import.
          # A malformed/undecodable key skips the signature rather than failing
          # the whole release — checksums are still attached either way.
          if ! printf '%s' "$GPG_PRIVATE_KEY" | base64 -d 2>/dev/null | gpg --batch --import 2>/dev/null; then
            echo "GPG_PRIVATE_KEY could not be decoded/imported — skipping GPG signature (checksums still attached)."
            echo "Hint: store it as 'gpg --armor --export-secret-keys <id> | base64'."
            exit 0
          fi
          # Produce a detached, armored signature: SHA256SUMS.asc
          gpg --batch --yes --pinentry-mode loopback \
            ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "Signed SHA256SUMS -> SHA256SUMS.asc"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------
  # Publish the CLI to npm via trusted publishing: npm trusts this workflow
  # (configured on the package's npmjs.com settings) through GitHub's OIDC
  # token, so no npm token is stored, and provenance is attached automatically.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: build-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing exchanges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Align version with tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Use the CLI-specific README for the npm package
        # The package ships only the CLI, so publish the CLI-focused readme
        # instead of the GUI-led root README. This runs on an ephemeral
        # checkout, so it does not modify the repo.
        run: cp README.cli.md README.md

      - name: Publish
        shell: bash
        run: |
          # Prerelease tags (containing a hyphen) publish under the `next`
          # dist-tag so they never become the default `npm install` version.
          DIST_TAG=latest
          case "$GITHUB_REF_NAME" in *-*) DIST_TAG=next ;; esac
          echo "Publishing with dist-tag: $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"
