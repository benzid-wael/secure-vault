name: CI

# Regression gate that runs on every branch (and PR) so problems surface
# before release. The release workflow (release.yml) stays tag-triggered and
# handles packaging/publishing; this one never releases.
on:
  push:
    branches:
      - '**'
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diff coverage can compare against the base branch.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check (report-only)
        # The project is plain JS/JSX; tsc --checkJs surfaces likely type bugs
        # but is not a gate yet. continue-on-error keeps it non-blocking while
        # still annotating findings in the run.
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Set up Python (for diff coverage)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Diff coverage (changed lines vs base)
        # Only meaningful on feature branches / PRs — main has no base to diff.
        # Fails if coverage on changed lines drops below the threshold, so new
        # code stays tested even while the overall suite is still catching up.
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python -m pip install --quiet "diff-cover>=9"
          git fetch --no-tags origin "$BASE_REF"
          diff-cover coverage/lcov.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --format markdown:diff-coverage.md
          # Surface the report in the job summary.
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build (no release)
        run: npm run build:all

  # The unit tests on the other desktop platforms (GUI-ENV-BREAKDOWN New-13):
  # the vault lock, the Windows rename retry and file modes behave
  # differently there. In parallel with Verify, so it doesn't slow the gate;
  # no coverage here, so thresholds are enforced on one platform only.
  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Keep line endings as committed
        # Otherwise Windows checks files out with CRLF, and tests that read
        # fixtures or compare output see a difference no user would.
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

  # Every e2e scenario against the built app (GUI-ENV-BREAKDOWN Task 30), in
  # parallel with Verify. The renderer stays sandboxed: Chromium's sandbox
  # is made to work, never switched off.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Allow Chromium's sandbox
        # Ubuntu 24.04 blocks the unprivileged user namespaces it needs; an
        # installed desktop allows them via AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: e2e scenarios
        run: xvfb-run -a npm run test:e2e
